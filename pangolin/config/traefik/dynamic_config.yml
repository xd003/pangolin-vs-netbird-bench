# Dynamic config for the bench (derived from pangolin/config/traefik/dynamic_config.yml).
# Dashboard host is pangolin.bench.test; Pangolin-generated resource routers are added via the http provider.
tls:
  certificates:
    - certFile: /certs/bench.test.crt
      keyFile: /certs/bench.test.key

http:
  middlewares:
    badger:
      plugin:
        badger:
          disableForwardAuth: true
    redirect-to-https:
      redirectScheme:
        scheme: https

  routers:
    main-app-router-redirect:
      rule: "Host(`pangolin.bench.test`)"
      service: next-service
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
        - badger

    next-router:
      rule: "Host(`pangolin.bench.test`) && !PathPrefix(`/api/v1`)"
      service: next-service
      entryPoints:
        - websecure
      middlewares:
        - badger
      tls: {}

    api-router:
      rule: "Host(`pangolin.bench.test`) && PathPrefix(`/api/v1`)"
      service: api-service
      entryPoints:
        - websecure
      middlewares:
        - badger
      tls: {}

    ws-router:
      rule: "Host(`pangolin.bench.test`)"
      service: api-service
      entryPoints:
        - websecure
      middlewares:
        - badger
      tls: {}

  services:
    next-service:
      loadBalancer:
        servers:
          - url: "http://pangolin:3002"

    api-service:
      loadBalancer:
        servers:
          - url: "http://pangolin:3000"

tcp:
  serversTransports:
    pp-transport-v1:
      proxyProtocol:
        version: 1
    pp-transport-v2:
      proxyProtocol:
        version: 2
